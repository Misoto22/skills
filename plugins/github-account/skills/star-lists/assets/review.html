<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Star Lists Review</title>
<style>
:root{--bg:#f6f7f5;--panel:#fff;--fg:#1d2320;--muted:#66706a;--line:#dfe3df;--accent:#b7791f;--changed:#2f6fdb;color-scheme:light}
@media (prefers-color-scheme:dark){:root{--bg:#141715;--panel:#1c201e;--fg:#e7ebe8;--muted:#97a19b;--line:#2d332f;--accent:#e0a341;--changed:#6aa0ff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
.wrap{max-width:1180px;margin:0 auto;padding:20px 16px 48px}
header{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:16px}
h1{font-size:22px;margin:0}
.sub{color:var(--muted);margin:4px 0 0}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 12px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.grid{display:grid;grid-template-columns:240px minmax(0,1fr);gap:20px;align-items:start}
aside{position:sticky;top:12px;display:flex;flex-direction:column;gap:2px;max-height:calc(100vh - 24px);overflow:auto}
.filter{display:flex;justify-content:space-between;gap:8px;text-align:left;border:0;background:none;padding:5px 8px;border-radius:6px}
.filter[aria-pressed="true"]{background:var(--panel);box-shadow:inset 0 0 0 1px var(--line);font-weight:600}
.n{color:var(--muted);font-variant-numeric:tabular-nums}
.tools{display:flex;gap:8px;margin-bottom:10px}
#q{flex:1;min-width:0;border:1px solid var(--line);background:var(--panel);color:inherit;border-radius:8px;padding:7px 10px;font:inherit}
.rows{background:var(--panel);border:1px solid var(--line);border-radius:10px}
.row{padding:10px 14px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:6px}
.row:first-child{border-top:0}
.row.changed{box-shadow:inset 3px 0 0 var(--changed)}
.name{font-family:ui-monospace,Menlo,monospace;font-size:13px;color:inherit;overflow-wrap:anywhere}
.desc{color:var(--muted);font-size:13px;margin:0;overflow-wrap:anywhere}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;border-radius:999px;padding:2px 9px;border:1px solid var(--line);background:none;color:var(--muted)}
.chip.on{border-color:var(--accent);color:var(--fg);background:color-mix(in srgb,var(--accent) 14%,transparent);font-weight:500}
.empty{padding:28px;text-align:center;color:var(--muted)}
@media (max-width:760px){.grid{grid-template-columns:minmax(0,1fr)}aside{position:static;max-height:none;flex-flow:row wrap}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>Star Lists Review</h1>
      <p class="sub" id="summary"></p>
    </div>
    <div class="tools">
      <span class="n" id="changedCount"></span>
      <button class="btn primary" id="save" type="button">Save edited plan</button>
    </div>
  </header>
  <div class="grid">
    <aside id="filters" aria-label="Filter by list"></aside>
    <main>
      <div class="tools"><input id="q" type="search" placeholder="Search repositories" aria-label="Search repositories"></div>
      <div class="rows" id="rows"></div>
    </main>
  </div>
</div>
<script>
const PLAN = /*__PLAN__*/null;
const original = JSON.parse(JSON.stringify(PLAN.assignments));
const assignments = PLAN.assignments;
const listName = Object.fromEntries(PLAN.lists.map(l => [l.key, l.name]));
const repos = Object.keys(assignments).sort((a, b) => a.localeCompare(b));
let filter = "all", query = "";

const same = (a, b) => a.length === b.length && a.every(k => b.includes(k));
const changed = repo => !same(assignments[repo] || [], original[repo] || []);

function el(tag, attrs, text) {
  const node = document.createElement(tag);
  Object.entries(attrs || {}).forEach(([k, v]) => node.setAttribute(k, v));
  if (text !== undefined) node.textContent = text;
  return node;
}

function visible(repo) {
  const keys = assignments[repo] || [];
  if (filter === "changed" && !changed(repo)) return false;
  if (filter === "multi" && keys.length < 2) return false;
  if (filter === "none" && keys.length) return false;
  if (listName[filter] && !keys.includes(filter)) return false;
  const meta = (PLAN.repos || {})[repo] || {};
  return !query || (repo + " " + (meta.description || "")).toLowerCase().includes(query);
}

function renderFilters() {
  const aside = document.getElementById("filters");
  aside.textContent = "";
  const count = key => repos.filter(r => (assignments[r] || []).includes(key)).length;
  const entries = [
    ["all", "All", repos.length],
    ["changed", "Changed", repos.filter(changed).length],
    ["multi", "In several lists", repos.filter(r => (assignments[r] || []).length > 1).length],
    ["none", "In no list", repos.filter(r => !(assignments[r] || []).length).length],
    ...PLAN.lists.map(l => [l.key, l.name, count(l.key)]),
  ];
  entries.forEach(([key, label, n]) => {
    const button = el("button", {type: "button", class: "filter", "aria-pressed": String(filter === key)});
    button.append(el("span", {}, label), el("span", {class: "n"}, String(n)));
    button.onclick = () => { filter = key; render(); };
    aside.append(button);
  });
}

function renderRows() {
  const box = document.getElementById("rows");
  box.textContent = "";
  const shown = repos.filter(visible);
  if (!shown.length) { box.append(el("div", {class: "empty"}, "No repositories match.")); return; }
  shown.forEach(repo => {
    const row = el("div", {class: "row" + (changed(repo) ? " changed" : "")});
    const link = el("a", {class: "name", href: "https://github.com/" + repo, target: "_blank", rel: "noopener"}, repo);
    row.append(link);
    const meta = (PLAN.repos || {})[repo] || {};
    if (meta.description) row.append(el("p", {class: "desc"}, meta.description));
    const chips = el("div", {class: "chips"});
    PLAN.lists.forEach(l => {
      const on = (assignments[repo] || []).includes(l.key);
      const chip = el("button", {type: "button", class: "chip" + (on ? " on" : ""), "aria-pressed": String(on)}, l.name);
      chip.onclick = () => {
        const keys = assignments[repo] || [];
        assignments[repo] = on ? keys.filter(k => k !== l.key) : [...keys, l.key];
        render();
      };
      chips.append(chip);
    });
    row.append(chips);
    box.append(row);
  });
}

function render() {
  renderFilters();
  renderRows();
  const n = repos.filter(changed).length;
  document.getElementById("changedCount").textContent = n + (n === 1 ? " change" : " changes");
  document.getElementById("summary").textContent =
    `${PLAN.account || "Account"}: ${repos.length} starred repositories, ${PLAN.lists.length} lists. Toggle a list to add or remove a repository; a repository may sit in several.`;
}

document.getElementById("q").addEventListener("input", e => { query = e.target.value.trim().toLowerCase(); renderRows(); });
document.getElementById("save").onclick = () => {
  const blob = new Blob([JSON.stringify(PLAN, null, 2) + "\n"], {type: "application/json"});
  const link = el("a", {href: URL.createObjectURL(blob), download: "plan.reviewed.json"});
  document.body.append(link);
  link.click();
  link.remove();
};
render();
</script>
</body>
</html>
