<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="github-account plugin — star-lists sorts starred repositories into GitHub Lists, star-prune unstars archived and dormant ones with a backup">
<defs>
<radialGradient id="w1" cx="0.2" cy="0.1" r="0.9"><stop offset="0" stop-color="#3a2a1c"/><stop offset="1" stop-color="#3a2a1c" stop-opacity="0"/></radialGradient>
<radialGradient id="w2" cx="0.95" cy="0.9" r="0.8"><stop offset="0" stop-color="#1f2e29"/><stop offset="1" stop-color="#1f2e29" stop-opacity="0"/></radialGradient>
<radialGradient id="w3" cx="0.7" cy="0.05" r="0.6"><stop offset="0" stop-color="#2a2536"/><stop offset="1" stop-color="#2a2536" stop-opacity="0"/></radialGradient>
<clipPath id="stage"><rect x="424" y="20" width="436" height="260" rx="10"/></clipPath>
</defs>
<style>
.sans{font-family:system-ui, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif} .mono{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace}
.eyebrow{font-size:12px;fill:#edecec99}
.head{font-size:30px;font-weight:400;letter-spacing:-0.6px;fill:#edecec}
.sub{font-size:14px;fill:#edecec99}
.cmd{font-size:13px;fill:#f54e00}
.title{font-size:11px;fill:#edecec99}
.row{font-size:12px;fill:#edecec} .dim{font-size:12px;fill:#edecec99}
.faint{font-size:12px;fill:#edecec59} .ok{font-size:12px;fill:#3fa37f} .hot{font-size:12px;fill:#f54e00}
</style>
<rect width="880" height="300" fill="#14120b"/>
<g clip-path="url(#stage)"><rect x="424" y="20" width="436" height="260" fill="#1b1913"/>
<rect x="424" y="20" width="436" height="260" fill="url(#w1)"/>
<rect x="424" y="20" width="436" height="260" fill="url(#w2)"/>
<rect x="424" y="20" width="436" height="260" fill="url(#w3)"/></g>
<rect x="456" y="48" width="372" height="204" rx="8" fill="#201e18" stroke="#edecec33"/>
<line x1="456" y1="74.5" x2="828" y2="74.5" stroke="#edecec1a"/>
<circle cx="472" cy="61" r="4" fill="#edecec33"/>
<circle cx="485" cy="61" r="4" fill="#edecec33"/>
<circle cx="498" cy="61" r="4" fill="#edecec33"/>
<text class="mono title" x="518" y="65">github.com/you?tab=stars</text>
<text class="mono eyebrow" x="48" y="66">github-account · star-lists · star-prune</text>
<text class="sans head" x="48" y="106">Keep your stars</text>
<text class="sans head" x="48" y="142">worth starring.</text>
<text class="sans sub" x="48" y="182">Sort every star into a List from one</text>
<text class="sans sub" x="48" y="203">reviewed plan, then unstar the dead ones</text>
<text class="sans sub" x="48" y="224">you confirm — with a backup to undo it.</text>
<text class="mono cmd" x="48" y="271">/github-account:star-lists →</text>
<text class="mono dim" x="476" y="98">star-lists  plan.json</text>
<text class="mono row" x="476" y="122">AI agents</text>
<rect x="616" y="113" width="91" height="9" rx="2" fill="#edecec2e"/>
<text class="mono dim" x="715" y="122">38</text>
<text class="mono row" x="476" y="143">Developer tools</text>
<rect x="616" y="134" width="130" height="9" rx="2" fill="#edecec2e"/>
<text class="mono dim" x="753" y="143">54</text>
<text class="mono row" x="476" y="164">Design systems</text>
<rect x="616" y="155" width="41" height="9" rx="2" fill="#edecec2e"/>
<text class="mono dim" x="664" y="164">17</text>
<text class="mono row" x="476" y="185">Rust</text>
<rect x="616" y="176" width="62" height="9" rx="2" fill="#edecec2e"/>
<text class="mono dim" x="686" y="185">26</text>
<text class="mono faint" x="476" y="206">Unsorted</text>
<text class="mono hot" x="616" y="206">412 → 0</text>
<line x1="476" y1="219.5" x2="808" y2="219.5" stroke="#edecec1a"/>
<text class="mono dim" x="476" y="238">star-prune</text>
<text class="mono row" x="572" y="238">3 unstar · 14 keep</text>
<text class="mono ok" x="752" y="238">✓ backup</text>
</svg>
