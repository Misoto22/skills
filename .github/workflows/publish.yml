name: Publish

# Tell the readers outside Claude Code that the catalogue moved.
#
# registry.json is served from raw.githubusercontent.com, so the file is current
# the moment it lands on main. What is not current is whatever cached it: the
# personal site holds it under an ISR tag with an hour's revalidation, so without
# this a merged skill stays invisible there for up to an hour.
#
# Scoped to the one file. Editing a README or a workflow changes nothing any
# reader fetches, and a purge on every push is a purge nobody reads as meaning
# anything.

on:
  push:
    branches: [main]
    paths: ["registry.json"]
  # The same purge, for when a cache has to be dropped without an edit to force
  # it — a site redeploy that came up holding a stale copy, most often.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Both reach the script through the environment rather than being
      # interpolated into it: an expression expanded into a shell line is
      # expanded before the shell sees it, which is how a secret reaches a trace.
      - name: Purge the site's cached catalogue
        env:
          URL: ${{ secrets.SITE_REVALIDATE_URL }}
          TOKEN: ${{ secrets.SITE_REVALIDATE_TOKEN }}
        run: |
          if [ -z "$URL" ] || [ -z "$TOKEN" ]; then
            echo "::notice::no site configured — set SITE_REVALIDATE_URL and SITE_REVALIDATE_TOKEN to enable"
            exit 0
          fi
          # A purge that never landed looks exactly like one that did, and the
          # symptom surfaces an hour later as a page still showing last week's
          # catalogue. So a refusal from the site still fails the run.
          #
          # A refusal from in front of the site is a different thing. The zone is
          # on Cloudflare's free plan with Bot Fight Mode on, which challenges
          # datacenter IPs and cannot be scoped to a path — a WAF skip rule was
          # tried and does not apply below Pro. So this request is challenged
          # from a runner and answers normally from a laptop, and no change on
          # this side reaches the app. Failing on it would paint every merge red
          # for a condition the repository cannot fix, which is how a red check
          # stops being read at all.
          #
          # Falling back to the ISR window is the accepted outcome: the site
          # revalidates the tag within the hour on its own.
          body=$(mktemp)
          status=$(curl --silent --show-error \
            --request POST \
            --header "Authorization: Bearer $TOKEN" \
            --write-out '%{http_code}' \
            --output "$body" \
            --max-time 30 \
            --retry 3 --retry-delay 5 --retry-connrefused \
            "$URL?tag=agent-skills") || status=000
          if grep -qi 'cf-chl\|Just a moment' "$body" 2>/dev/null; then
            echo "::warning::revalidate blocked by a Cloudflare challenge (HTTP $status) — the site will revalidate on its own within the ISR hour"
            exit 0
          fi
          cat "$body" >&2
          if [ "$status" -lt 200 ] || [ "$status" -ge 300 ]; then
            echo "::error::revalidate returned $status"
            exit 1
          fi
          echo "::notice::revalidate returned $status"
