name: Install

# Each job installs the skills the way a real user would, then runs
# verify-install.py against whatever that installer produced. The assertions
# run on the artifact the agent actually reads, so an installer that silently
# drops shared/ fails here rather than at the user's first invocation.

on:
  pull_request:
  push:
    branches: [main]
  # Canary calls this with channel: latest, so the routes exist once. A second
  # copy of them would be a second thing to keep in step with the installers.
  workflow_call:
    inputs:
      channel:
        description: pinned | latest
        type: string
        default: pinned

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.channel || 'pinned' }}
  cancel-in-progress: true

env:
  CI_CHANNEL: ${{ inputs.channel || 'pinned' }}

jobs:
  claude-code:
    name: Claude Code plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - run: npm install --global "$(python3 scripts/ci-pins.py spec claude-code)"

      # Read from the marketplace manifest, so a rename never edits this file.
      - name: Resolve the marketplace name
        run: echo "MARKETPLACE=$(bash scripts/marketplace-name.sh)" >> "$GITHUB_ENV"

      # Derived from the tree, so adding a plugin never edits this step.
      - name: Install every plugin
        run: |
          claude plugin marketplace add "$PWD"
          for plugin in $(bash scripts/list-plugins.sh); do
            claude plugin install "$plugin@$MARKETPLACE"
          done

      # Derived from the tree, so adding a skill never edits this step.
      - name: Every skill is registered under its own prefix
        run: |
          for skill_file in $(bash scripts/list-skills.sh); do
            plugin=$(echo "$skill_file" | cut -d/ -f2)
            skill=$(basename "$(dirname "$skill_file")")
            claude plugin details "$plugin@$MARKETPLACE" | grep -qE "Skills \(.*\b$skill\b" \
              || { echo "::error::$plugin@$MARKETPLACE does not list $skill"; exit 1; }
          done

      - name: Installed trees are complete and self-contained
        run: |
          python3 scripts/verify-install.py \
            "$HOME/.claude/plugins/cache/$MARKETPLACE" \
            $(bash scripts/list-skills.sh | awk -F/ '{print "--expect " $(NF-1)}')

  codex:
    name: Codex plugin
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - run: npm install --global "$(python3 scripts/ci-pins.py spec codex)"

      # Read from the marketplace manifest, so a rename never edits this file.
      - name: Resolve the marketplace name
        run: echo "MARKETPLACE=$(bash scripts/marketplace-name.sh)" >> "$GITHUB_ENV"

      # Derived from the tree, so adding a plugin never edits this step.
      - name: Install every plugin
        run: |
          codex plugin marketplace add "$PWD"
          for plugin in $(bash scripts/list-plugins.sh); do
            codex plugin add "$plugin@$MARKETPLACE"
          done

      - name: Installed trees are complete and self-contained
        run: |
          python3 scripts/verify-install.py \
            "$HOME/.codex/plugins/cache/$MARKETPLACE" \
            $(bash scripts/list-skills.sh | awk -F/ '{print "--expect " $(NF-1)}')

  agent-skills-cli:
    name: npx skills add (all agents)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      # An isolated HOME so the install cannot inherit anything from the runner.
      - name: Install into every supported agent directory
        run: |
          FAKE_HOME="$(mktemp -d)"
          echo "FAKE_HOME=$FAKE_HOME" >> "$GITHUB_ENV"
          HOME="$FAKE_HOME" npx --yes "$(python3 scripts/ci-pins.py spec skills)" add "$PWD" \
            --agent '*' --skill '*' --global --yes --copy

      - name: Every installed copy is complete and self-contained
        run: |
          test "$(find "$FAKE_HOME" -name SKILL.md | wc -l)" -gt 0
          python3 scripts/verify-install.py "$FAKE_HOME" \
            $(bash scripts/list-skills.sh | awk -F/ '{print "--expect " $(NF-1)}')

  skill-archive:
    name: .skill upload bundle
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      - name: Package and unpack every skill
        run: |
          mkdir -p dist unpacked
          for skill_file in $(bash scripts/list-skills.sh); do
            python3 scripts/package-skill.py "${skill_file%/SKILL.md}" dist
          done
          for archive in dist/*.skill; do
            python3 -c "import sys, zipfile; zipfile.ZipFile(sys.argv[1]).extractall('unpacked')" "$archive"
          done

      - name: Unpacked archive is complete and self-contained
        run: |
          python3 scripts/verify-install.py unpacked \
            $(bash scripts/list-skills.sh | awk -F/ '{print "--expect " $(NF-1)}')
