name: Evals

# Outside the pull-request gate on purpose. Scoring costs money and takes
# minutes, and a description rarely breaks on the commit that edits it — it
# breaks when a *neighbouring* skill's description grows into its territory.
# Weekly catches that; a gate on every push would only bill for the cases the
# author already had in mind.
on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
    inputs:
      skill:
        description: "One skill to score, or blank for all of them"
        required: false
        type: string

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Install the Anthropic SDK
        run: python3 -m pip install --quiet "$(python3 scripts/ci-pins.py spec anthropic)"
      - name: Score the evaluation cases
        id: score
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          # Through the environment, never interpolated into the script: this
          # job holds a key, which is not somewhere to expand an arbitrary
          # dispatch input into a shell.
          SKILL: ${{ inputs.skill }}
          REPORT: ${{ runner.temp }}/evals.txt
        run: |
          set -o pipefail
          set +e
          if [ -n "$SKILL" ]; then
            python3 scripts/run-evals.py --run "$SKILL" 2>&1 | tee "$REPORT"
          else
            python3 scripts/run-evals.py --run 2>&1 | tee "$REPORT"
          fi
          routing_status=${PIPESTATUS[0]}
          python3 scripts/run-evals.py --run-behaviors synastry-reading 2>&1 | tee -a "$REPORT"
          behavior_status=${PIPESTATUS[0]}
          if [ "$routing_status" -ne 0 ] || [ "$behavior_status" -ne 0 ]; then
            exit 1
          fi
      - name: Report an evaluation regression
        if: failure() && steps.score.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          REPORT: ${{ runner.temp }}/evals.txt
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          body=$(printf 'A scheduled eval run found a routing or behavior regression.\n\n```\n%s\n```\n\nRun: %s\n' \
            "$(tail -c 40000 "$REPORT")" "$RUN_URL")
          existing=$(gh issue list --state open --label evals --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label evals --title "Evals: routing or behavior regression" --body "$body"
          fi
