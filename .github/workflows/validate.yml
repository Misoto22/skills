name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v

  repository:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Validate repository metadata
        run: python3 scripts/validate-repository.py --skip-tests
      - name: Verify Agent Skills discovery
        run: npx --yes skills@1.5.20 add . --list
      - name: Validate Claude Code marketplace
        run: |
          npm install --global @anthropic-ai/claude-code@2.1.220
          claude plugin validate .
