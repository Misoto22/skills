name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ruff-action takes its version as an input, so this is the one pin no
    # script can resolve. `ci-pins.py check` holds it to .ci-pins.json.
    env:
      RUFF_VERSION: "0.14.6"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          version: ${{ env.RUFF_VERSION }}
          args: check --output-format github
      - uses: astral-sh/ruff-action@4919ec5cf1f49eff0871dbcea0da843445b837e6 # v3
        with:
          version: ${{ env.RUFF_VERSION }}
          args: format --check
      - name: shellcheck
        run: shellcheck scripts/*.sh

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      # The supported range, which is a different fact from the version the
      # single-version jobs run on — that one is the `python` pin, and
      # `ci-pins.py check` holds every `python-version: "x.y"` to it. A list is
      # not that shape, so this line is deliberately outside the pin: widening
      # or dropping support is a decision, not a bump.
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: ${{ matrix.python-version }}
      # Derived from the tree: a skill declares its own dependencies, and the
      # second one to need any must not also need a workflow edit.
      - name: Install every skill's declared dependencies
        run: bash scripts/install-skill-requirements.sh
      - run: python3 -m unittest discover -s tests -v

  coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      # A floor on the Python that ships. The repository's own scripts run
      # through subprocess in the contract tests, so measuring them would
      # describe the harness; .coveragerc scopes this to plugins/.
      - name: Cover the shipped skill scripts
        run: |
          bash scripts/install-skill-requirements.sh
          python3 -m pip install --quiet "$(python3 scripts/ci-pins.py spec coverage)"
          python3 -m coverage run -m unittest discover -s tests
          python3 -m coverage report

  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"
      - name: Audit CLI pins
        run: python3 scripts/ci-pins.py check
      - name: Audit version declarations
        run: python3 scripts/bump-version.py --audit
      - name: Check evaluation coverage
        run: python3 scripts/run-evals.py --check
      - name: Check skill descriptions
        run: python3 scripts/check-descriptions.py --report
      # The catalogue every reader outside Claude Code fetches. It is generated,
      # so it goes stale silently: the tree is right, the build is green, and the
      # site serves last week's skills until someone happens to rebuild it.
      - name: Hold the published registry current
        run: python3 scripts/build-registry.py --check
      - name: Validate repository metadata
        run: python3 scripts/validate-repository.py --skip-tests
      - name: Verify Agent Skills discovery
        run: npx --yes "$(python3 scripts/ci-pins.py spec skills)" add . --list
      - name: Validate Claude Code marketplace
        run: |
          npm install --global "$(python3 scripts/ci-pins.py spec claude-code)"
          claude plugin validate .
