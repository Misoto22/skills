name: Validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ruff-action takes its version as an input, so this is the one pin no
    # script can resolve. `ci-pins.py check` holds it to .ci-pins.json.
    env:
      RUFF_VERSION: "0.14.6"
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/ruff-action@v3
        with:
          version: ${{ env.RUFF_VERSION }}
          args: check --output-format github
      - uses: astral-sh/ruff-action@v3
        with:
          version: ${{ env.RUFF_VERSION }}
          args: format --check
      - name: shellcheck
        run: shellcheck scripts/*.sh

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python3 -m unittest discover -s tests -v

  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Audit CLI pins
        run: python3 scripts/ci-pins.py check
      - name: Audit version declarations
        run: python3 scripts/bump-version.py --audit
      - name: Check skill descriptions
        run: python3 scripts/check-descriptions.py --report
      - name: Validate repository metadata
        run: python3 scripts/validate-repository.py --skip-tests
      - name: Verify Agent Skills discovery
        run: npx --yes "$(python3 scripts/ci-pins.py spec skills)" add . --list
      - name: Validate Claude Code marketplace
        run: |
          npm install --global "$(python3 scripts/ci-pins.py spec claude-code)"
          claude plugin validate .
