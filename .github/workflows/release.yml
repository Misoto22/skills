name: Release

# GitHub marketplace sync is an organization feature, so claude.ai and Cowork
# are served by manually uploaded .skill archives. This builds them once per
# tag instead of asking every consumer to rebuild them locally.
#
# Two ways in, one path through. Pushing a tag is the ordinary route. Dispatch
# exists because some callers can trigger a workflow but cannot push a tag; it
# creates the tag itself, from the default branch only, and every step after
# resolution works from $TAG rather than from what triggered the run.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the v — must equal what the manifests declare
        type: string
        required: true

env:
  UV_VERSION: "0.12.5"
  # A runner has no virtual environment, and uv refuses to install without one
  # rather than quietly writing into the interpreter. Saying so here is the
  # declaration; a script that named an interpreter instead would carry the same
  # decision to a contributor's machine, where it is the wrong one.
  UV_SYSTEM_PYTHON: 1

permissions:
  contents: write
  # attest-build-provenance signs through Sigstore and records the attestation
  # against the repository, which needs both of these.
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      # A dispatch can be started from any ref. Releasing a feature branch would
      # tag and publish work that was never reviewed.
      - name: Release only from the default branch
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "$GITHUB_REF_NAME" != "$DEFAULT_BRANCH" ]; then
            echo "::error::dispatched from $GITHUB_REF_NAME; release only from $DEFAULT_BRANCH"
            exit 1
          fi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      # Nothing upstream of here compares the release to the manifests. A
      # mistyped tag would publish archives whose own metadata.version disagrees
      # with the release they hang under, and that is invisible after upload.
      # Both triggers land on the same answer, and $TAG carries it from here on.
      - name: Resolve the release, and refuse one the manifests do not declare
        env:
          # Via the environment, never interpolated into the script: this job
          # holds contents: write and a signing identity.
          REQUESTED: ${{ inputs.version }}
        run: |
          declared=$(python3 scripts/bump-version.py --check | awk '{print $NF}')
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            asked="$REQUESTED"
          else
            asked="$GITHUB_REF_NAME"
          fi
          # Both forms mean the same release; the tag carries the v, the input
          # is documented without it, and neither slip is worth a failed run.
          asked="${asked#v}"
          if [ "$declared" != "$asked" ]; then
            echo "::error::asked for $asked, but the manifests declare $declared"
            exit 1
          fi
          echo "TAG=v$declared" >> "$GITHUB_ENV"

      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10
        with:
          version: ${{ env.UV_VERSION }}
      # The suite below imports the ephemeris a skill declares for itself. This
      # job ran it without them from 0.8.2 onward and nothing noticed, because
      # the four releases after that were never tagged.
      - name: Install every skill's declared dependencies
        run: bash scripts/install-skill-requirements.sh

      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v

      # A tag pushed with GITHUB_TOKEN does not start another workflow run, so
      # this cannot hand off to the push trigger — the job finishes the release.
      - name: Create the tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null 2>&1; then
            echo "::error::$TAG already exists; releasing it again would rewrite history"
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "skills $TAG"
          git push origin "$TAG"

      - name: Package every published skill
        run: |
          mkdir -p dist
          for skill_file in $(bash scripts/list-skills.sh); do
            python3 scripts/package-skill.py "${skill_file%/SKILL.md}" dist
          done
          ls -l dist

      # claude.ai and Cowork take an uploaded file rather than a marketplace
      # sync, so between this release page and the skills UI there is a download
      # nothing checks. Packaging is already deterministic; these give someone
      # holding the file a way to prove it is the one this tag built.
      - name: Checksum every archive
        run: |
          (cd dist && sha256sum ./*.skill | sed 's#\./##' > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*.skill

      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.skill dist/SHA256SUMS --clobber
          else
            gh release create "$TAG" dist/*.skill dist/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "$TAG"
          fi
