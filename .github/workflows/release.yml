name: Release

# GitHub marketplace sync is an organization feature, so claude.ai and Cowork
# are served by manually uploaded .skill archives. This builds them once per
# tag instead of asking every consumer to rebuild them locally.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  # attest-build-provenance signs through Sigstore and records the attestation
  # against the repository, which needs both of these.
  id-token: write
  attestations: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: "3.13"

      # Nothing upstream of here compares the tag to the manifests. A mistyped
      # tag would publish archives whose own metadata.version disagrees with the
      # release they hang under, and the mismatch is invisible after upload.
      - name: The tag matches the version every artifact declares
        run: |
          declared=$(python3 scripts/bump-version.py --check | awk '{print $NF}')
          if [ "v$declared" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME, but the manifests declare $declared"
            exit 1
          fi

      - name: Run the test suite
        run: python3 -m unittest discover -s tests -v

      - name: Package every published skill
        run: |
          mkdir -p dist
          for skill_file in $(bash scripts/list-skills.sh); do
            python3 scripts/package-skill.py "${skill_file%/SKILL.md}" dist
          done
          ls -l dist

      # claude.ai and Cowork take an uploaded file rather than a marketplace
      # sync, so between this release page and the skills UI there is a download
      # nothing checks. Packaging is already deterministic; these give someone
      # holding the file a way to prove it is the one this tag built.
      - name: Checksum every archive
        run: |
          (cd dist && sha256sum ./*.skill | sed 's#\./##' > SHA256SUMS)
          cat dist/SHA256SUMS

      - uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3
        with:
          subject-path: dist/*.skill

      - name: Attach the archives to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" dist/*.skill dist/SHA256SUMS --clobber
          else
            gh release create "$GITHUB_REF_NAME" dist/*.skill dist/SHA256SUMS \
              --verify-tag \
              --generate-notes \
              --title "$GITHUB_REF_NAME"
          fi
