# The repository runs on the standard library only. These rules are the ones that
# catch real defects in that setting — silent subprocess failures, dead imports,
# shebangs on files nobody can execute — plus import order and formatting so
# diffs stay about behaviour.

line-length = 110
target-version = "py311"

[lint]
select = [
    "E",      # pycodestyle
    "F",      # pyflakes
    "I",      # import sorting
    "UP",     # pyupgrade
    "B",      # bugbear
    "SIM",    # simplify
    "RUF",    # ruff-specific
    "PLW",    # pylint warnings — PLW1510 catches subprocess.run without check=
    "EXE",    # shebang and executable-bit agreement
]

[lint.per-file-ignores]
# Skill scripts are imported by path, so tests prepend sys.path before importing
# them. That import cannot move to the top of the file.
"tests/**" = ["E402"]

# package-skill.py writes every archive member as mode 644, and SKILL.md documents
# these as `python3 scripts/<name>.py`. An executable bit in git would claim a way
# of running them that no installed copy has. The shebang stays as interpreter
# documentation.
"plugins/*/skills/*/scripts/*.py" = ["EXE001"]

# The scaffold's description has to be one physical line: the frontmatter parser
# reads plain key/value pairs and does not fold YAML scalars, so a wrapped
# description would be rejected by the validator it is meant to satisfy.
"scripts/new-skill.py" = ["E501"]

# The session-naming hook is a prompt template. Its separator is the fullwidth vertical
# line U+FF5C, which the scheme requires and an ASCII pipe would break, so the ambiguous
# character rules cannot apply; and its reminder text is injected verbatim, so wrapping a
# paragraph to the line limit would either change what the model reads or scatter one
# string across a dozen fragments.
"plugins/*/skills/*/assets/*.py" = ["RUF001", "RUF002", "E501", "EXE001"]
